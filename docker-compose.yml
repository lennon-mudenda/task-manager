services:
    app:
        build:
            context: .
            dockerfile: ${APP_DOCKERFILE:-docker/frankenphp/Dockerfile}
        container_name: ${APP_CONTAINER_NAME:-tasks_app}
        restart: ${APP_RESTART_POLICY:-unless-stopped}
        volumes:
            - .:/app
        ports:
            - "${APP_HTTP_PORT:-8000}:80"
            - "${APP_HTTPS_PORT:-443}:443"
        depends_on:
            - mysql
            - redis
            - mailpit
        env_file:
            - .env

    mysql:
        image: mysql:${MYSQL_VERSION:-8.0}
        container_name: ${MYSQL_CONTAINER_NAME:-tasks_mysql}
        restart: ${MYSQL_RESTART_POLICY:-unless-stopped}
        ports:
            - "${MYSQL_PORT:-3306}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-tasks_pass}
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: ${DB_DATABASE:-tasks_db}
            MYSQL_USER: ${DB_USERNAME:-tasks_user}
            MYSQL_PASSWORD: ${DB_PASSWORD:-tasks_pass}
        volumes:
            - mysql_data:/var/lib/mysql
#            - ./docker/mysql/init_db.sql:/docker-entrypoint-initdb.d/init.sql

    redis:
        image: redis:${REDIS_VERSION:-7-alpine}
        container_name: ${REDIS_CONTAINER_NAME:-tasks_redis}
        restart: ${REDIS_RESTART_POLICY:-unless-stopped}
        ports:
            - "${REDIS_PORT:-6379}:6379"

    mailpit:
        image: axllent/mailpit:${MAILPIT_VERSION:-latest}
        container_name: ${MAILPIT_CONTAINER_NAME:-tasks_mailpit}
        restart: ${MAILPIT_RESTART_POLICY:-unless-stopped}
        ports:
            - "${MAILPIT_SMTP_PORT:-1025}:1025"
            - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
    mysql_data:
        driver: local
